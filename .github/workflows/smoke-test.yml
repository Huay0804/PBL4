name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: fresh-clone smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        # CPU-only TensorFlow wheel is enough — the smoke test never enters a
        # training step, it only exercises import + --help + model constructors.
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        run: python scripts/smoke_test.py
